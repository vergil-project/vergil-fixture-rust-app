[package]
name = "vergil-fixture-rust-app"
version = "0.1.8"
edition = "2024"
description = "Vergil test fixture: a small Rust command-line application. No users."
license = "MIT"
repository = "https://github.com/vergil-project/vergil-fixture-rust-app"
readme = "README.md"
# A test fixture: nothing it builds ever reaches a package registry.
publish = false

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"
